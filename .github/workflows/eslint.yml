name: ESLint

on:
  push:
    branches: [ main, unit_test ]
  pull_request:
    branches: [ main, unit_test ]

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      - name: Install dependencies
        run: npm install
      - name: Run ESLint
        run: npm run lint 